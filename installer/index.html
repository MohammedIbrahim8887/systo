<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; font-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Install Systo</title>
<style>
@font-face{font-family:Geist;src:url('Geist.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{color-scheme:light;font-family:Geist,-apple-system,BlinkMacSystemFont,sans-serif;color:#111;background:#fff;font-synthesis:none;--secondary:#626262;--line:#dedede}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;-webkit-user-select:none;user-select:none}button{font:inherit;color:inherit}::selection{background:#222;color:#fff}
.brand{height:54px;display:flex;justify-content:center;align-items:center;gap:8px;font-size:25px;font-weight:650;background:linear-gradient(#fafafa,#f0f0f0);border-bottom:1px solid var(--line)}.brand img{width:36px;height:36px}
main{text-align:center;padding:20px 48px 0}h1{font-size:60px;font-weight:700;line-height:1.1;letter-spacing:-.035em;margin:10px 0 8px}.subtitle{font-size:30px;letter-spacing:-.025em;color:var(--secondary);margin:0}
.transfer{display:flex;align-items:center;justify-content:center;gap:50px;margin:24px auto 18px}.tile{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;padding:0;width:200px;border-radius:16px;font-size:25px;font-weight:620;letter-spacing:-.02em}.tile img{width:200px;height:200px;object-fit:contain;pointer-events:none}.app img{pointer-events:auto;-webkit-user-drag:element;cursor:grab}.app:active img{cursor:grabbing}.folder img{filter:grayscale(1)}.tile:hover{background:#f7f7f7}.tile:disabled{cursor:default;opacity:.55}.tile:disabled img{cursor:default}.folder.over{outline:3px solid #777;outline-offset:6px;background:#f4f4f4}.arrow{width:60px;height:60px;flex-shrink:0;color:#707070;margin-top:-28px}.instruction{font-size:23px;font-weight:500;letter-spacing:-.02em;color:var(--secondary);margin:0 0 8px}.destination{display:flex;justify-content:center;align-items:center;gap:8px;font-size:12px;color:var(--secondary)}.text-button{border:0;padding:4px;background:none;color:#555;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:12px}.text-button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid #777;outline-offset:4px}.status{font-size:13px;line-height:1.4;max-width:700px;min-height:19px;margin:6px auto 0;color:#555}.status.error{color:#242424;font-weight:550}footer{border-top:1px solid var(--line);font-size:21px;color:var(--secondary);padding:14px 0;margin-top:16px}.busy .arrow{opacity:.4}.busy .instruction::after{content:'…'}
@media(max-width:700px){main{padding:24px 24px 0}h1{font-size:46px}.subtitle{font-size:24px}.transfer{gap:18px}.tile{width:180px;font-size:22px}.tile img{width:180px;height:180px}.arrow{width:40px}.instruction{font-size:19px}}
</style>
</head>
<body>
<header class="brand"><img src="icon.png" alt=""><span>Systo</span></header>
<main>
<h1>Meet Systo.</h1>
<p class="subtitle">A clearer view of your Mac.</p>
<section class="transfer" aria-label="Install Systo">
<button class="tile app" id="install" type="button" aria-label="Install Systo"><img src="icon.png" draggable="true" id="app-icon" alt=""><span>Systo</span></button>
<svg class="arrow" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 32h50M39 15l17 17-17 17"/></svg>
<button class="tile folder" id="folder" type="button" aria-label="Install Systo to Applications"><img src="applications.png" alt=""><span id="folder-name">Applications</span></button>
</section>
<p class="instruction" id="instruction">Drag Systo to Applications to install.</p>
<div class="destination" id="destination"><span id="location">Or click the Systo icon.</span><button class="text-button" id="choose" type="button">Change folder…</button></div>
<p class="status" id="status" role="status" aria-live="polite"></p>
<footer>Your Mac, at a glance.</footer>
</main>
<script>
const install=document.getElementById('install'),choose=document.getElementById('choose'),status=document.getElementById('status'),folder=document.getElementById('folder'),icon=document.getElementById('app-icon'),instruction=document.getElementById('instruction');
let currentState='ready',destination='Applications',dragging=false;
function send(action){const bridge=window.webkit?.messageHandlers?.installer;if(bridge)bridge.postMessage(action);else window.installerState('error','Open the Systo Installer app to install. This browser is a design preview.');}
function act(){if(currentState!=='installing')send(currentState==='done'?'open':'install');}
install.addEventListener('click',act);folder.addEventListener('click',act);
choose.addEventListener('click',()=>send('choose'));
icon.addEventListener('dragstart',event=>{if(currentState==='installing'||currentState==='done'){event.preventDefault();return;}dragging=true;event.dataTransfer.setData('text/plain','systo-install');event.dataTransfer.effectAllowed='copy';});
icon.addEventListener('dragend',()=>{dragging=false;folder.classList.remove('over');});
folder.addEventListener('dragover',event=>{if(!dragging||currentState==='installing')return;event.preventDefault();event.dataTransfer.dropEffect='copy';folder.classList.add('over');});
folder.addEventListener('dragleave',()=>folder.classList.remove('over'));
folder.addEventListener('drop',event=>{event.preventDefault();folder.classList.remove('over');if(dragging&&event.dataTransfer.getData('text/plain')==='systo-install')act();dragging=false;});
window.installerState=(state,message)=>{currentState=state;document.body.classList.toggle('busy',state==='installing');install.disabled=folder.disabled=choose.disabled=state==='installing';icon.draggable=state!=='installing'&&state!=='done';install.setAttribute('aria-label',state==='done'?'Open Systo':state==='error'?'Try installing Systo again':'Install Systo');folder.setAttribute('aria-label',state==='done'?'Open Systo':'Install Systo to '+destination);instruction.textContent=state==='installing'?'Installing Systo':state==='done'?'Systo is ready. Click its icon to open.':state==='error'?'Click Systo to try again.':'Drag Systo to '+destination+' to install.';status.textContent=message||'';status.classList.toggle('error',state==='error');document.getElementById('destination').hidden=state==='done';};
window.installerLocation=(name)=>{destination=name.split('/').filter(Boolean).pop()||name;document.getElementById('folder-name').textContent=destination;document.getElementById('location').textContent=name;window.installerState('ready','');};
</script>
</body></html>
