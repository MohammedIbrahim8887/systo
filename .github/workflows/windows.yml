name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Unit tests
        run: bun test tests

      - name: Smoke test the Windows data layer
        run: bun scripts/win-smoke.ts

      - name: Build the desktop app
        run: pnpm build

      - name: Package a one-file installer
        shell: pwsh
        run: |
          Get-ChildItem -Recurse .farm/output/desktop/dist | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 400
          New-Item -ItemType Directory -Force release, payload | Out-Null
          $zip = Get-ChildItem -Recurse .farm/output/desktop/dist -Filter "*Setup.zip" | Select-Object -First 1
          if (-not $zip) { throw "Electrobun produced no setup zip" }
          Expand-Archive $zip.FullName -DestinationPath payload -Force
          Get-ChildItem -Recurse -Force payload | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 400
          $icon = Get-ChildItem -Recurse .farm/output/desktop/dist -Filter "app.ico" | Select-Object -First 1
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DPayload=$((Resolve-Path payload).Path)" "/DAppVersion=$version" "/DIcon=$($icon.FullName)" installer/windows/systo.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Copy-Item $zip.FullName release/Systo-Windows-x64.zip
          Get-FileHash release/* -Algorithm SHA256 | Format-Table -AutoSize | Out-String -Width 400

      - name: Install, launch and screenshot
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force proof | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save("proof/$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
          }
          # Get the runner's console out of the way so the screenshots show the app.
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Start-Process -FilePath release/Systo-Setup-x64.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES"
          Start-Sleep -Seconds 20
          Shot "01-installing"
          Start-Sleep -Seconds 40
          Shot "02-after-install"
          Get-Process | Where-Object { $_.Path -match "systo|webview" } | Select-Object Id, ProcessName, Path | Format-Table -AutoSize | Out-String -Width 400
          Get-ChildItem -Recurse -Depth 5 "$env:LOCALAPPDATA" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "systo" -and -not $_.PSIsContainer } | Select-Object -First 40 FullName, Length | Format-Table -AutoSize | Out-String -Width 400
          if (-not (Get-Process | Where-Object { $_.Path -match "systo" -and $_.ProcessName -notmatch "Setup" })) {
            $launcher = Get-ChildItem -Recurse "$env:LOCALAPPDATA" -Filter "launcher.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "systo" } | Select-Object -First 1
            if ($launcher) { Write-Host "Starting $($launcher.FullName)"; Start-Process $launcher.FullName; Start-Sleep -Seconds 30 }
          }
          Shot "03-running"
          Get-Process | Where-Object { $_.Path -match "systo|webview" } | Select-Object Id, ProcessName, Path | Format-Table -AutoSize | Out-String -Width 400

      - name: Open at sign-in toggle against the installed app
        shell: pwsh
        run: |
          $bun = Get-ChildItem -Recurse "$env:LOCALAPPDATA\dev.systo.monitor" -Filter "bun.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $bun) { throw "Systo isn't installed" }
          bun scripts/win-autostart-test.ts $bun.FullName

      - uses: actions/upload-artifact@v4
        with:
          name: Systo-Windows-x64
          path: release/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-proof
          path: proof/
          if-no-files-found: ignore
